name: erasmusgo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erasmus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Kopirajte .env.example u .env}
      POSTGRES_DB: ${POSTGRES_DB:-erasmus}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    command: ["--wait", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erasmus}:${POSTGRES_PASSWORD:?Kopirajte .env.example u .env}@db:5432/${POSTGRES_DB:-erasmus}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
    volumes:
      - ./apps/server/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erasmus}:${POSTGRES_PASSWORD:?Kopirajte .env.example u .env}@db:5432/${POSTGRES_DB:-erasmus}?sslmode=disable
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Kopirajte .env.example u .env}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data: