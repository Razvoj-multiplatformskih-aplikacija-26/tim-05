name: mobile
description: Mobilna aplikacija za studente. Pregled Erasmus ponuda i prijave na razmenu.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  domain:
    path: ../../packages/domain
  go_router: ^18.0.2
  use_cases:
    path: ../../packages/use_cases
  blocs:
    path: ../../packages/blocs
  flutter_bloc: 9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/ikonica/ikona.png
  remove_alpha_ios: true
  adaptive_icon_background: "#7E0D0E"
  adaptive_icon_foreground: assets/ikonica/ikona_prednji.png

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
