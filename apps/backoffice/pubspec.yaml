name: backoffice
description: Backoffice za koordinatore. Pregled, upoređivanje i obrada prijava na ponude univerziteta.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  blocs:
    path: ../../packages/blocs
  domain:
    path: ../../packages/domain
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.2
  ui:
    path: ../../packages/ui
  use_cases:
    path: ../../packages/use_cases

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: false
  ios: false
  image_path: assets/ikonica/ikona.png
  web:
    generate: true
    image_path: assets/ikonica/ikona.png
    background_color: "#7E0D0E"
    theme_color: "#7E0D0E"
  windows:
    generate: true
    image_path: assets/ikonica/ikona.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/ikonica/ikona.png

flutter:
  uses-material-design: true